[package]
name = "rig"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Config repository manager: compose, apply and absorb dotfiles"
license = "MIT"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
diffy = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = { version = "0.8", features = ["preserve_order"] }
toml_edit = "0.22"
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
strip = true
